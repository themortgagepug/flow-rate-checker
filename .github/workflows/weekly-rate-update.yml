name: Weekly Rate Update

on:
  schedule:
    # Every Monday at 10:00 AM ET (14:00 UTC)
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      rate_1yr:
        description: '1-Year Fixed Rate'
        required: true
        default: '4.74'
      rate_2yr:
        description: '2-Year Fixed Rate'
        required: true
        default: '4.29'
      rate_3yr:
        description: '3-Year Fixed Rate'
        required: true
        default: '3.49'
      rate_4yr:
        description: '4-Year Fixed Rate'
        required: true
        default: '3.89'
      rate_5yr_fixed:
        description: '5-Year Fixed Rate'
        required: true
        default: '3.69'
      rate_5yr_var:
        description: '5-Year Variable Rate'
        required: true
        default: '3.40'
      rate_10yr:
        description: '10-Year Fixed Rate'
        required: true
        default: '4.99'
      source:
        description: 'Rate source'
        required: true
        default: 'WOWA.ca Best Uninsured Rates'

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set rate values
        id: rates
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RATE_1YR=${{ inputs.rate_1yr }}" >> $GITHUB_ENV
            echo "RATE_2YR=${{ inputs.rate_2yr }}" >> $GITHUB_ENV
            echo "RATE_3YR=${{ inputs.rate_3yr }}" >> $GITHUB_ENV
            echo "RATE_4YR=${{ inputs.rate_4yr }}" >> $GITHUB_ENV
            echo "RATE_5YR_FIXED=${{ inputs.rate_5yr_fixed }}" >> $GITHUB_ENV
            echo "RATE_5YR_VAR=${{ inputs.rate_5yr_var }}" >> $GITHUB_ENV
            echo "RATE_10YR=${{ inputs.rate_10yr }}" >> $GITHUB_ENV
            echo "RATE_SOURCE=${{ inputs.source }}" >> $GITHUB_ENV
          else
            # Scheduled run: scrape best rates from WOWA.ca
            echo "Fetching rates from WOWA.ca..."
            SCRAPE_FAILED=false

            PAGE=$(curl -sL "https://wowa.ca/best-mortgage-rates" 2>/dev/null || true)
            if [ -z "$PAGE" ]; then
              PAGE=$(curl -sL "https://wowa.ca/mortgage-rates" 2>/dev/null || true)
            fi

            if [ -z "$PAGE" ]; then
              echo "::error::WOWA.ca is unreachable. Using fallback rates."
              SCRAPE_FAILED=true
            fi

            if [ "$SCRAPE_FAILED" = "false" ]; then
              # Try multiple regex patterns for resilience
              # Pattern 1: Look for rate numbers near term labels
              RATE_5YR=$(echo "$PAGE" | grep -oP '\b[3-7]\.\d{2}(?=%?\s*</?(td|span|div))' | head -1 || echo "")
              # Pattern 2: Look for common rate format in JSON-LD or data attributes
              if [ -z "$RATE_5YR" ]; then
                RATE_5YR=$(echo "$PAGE" | grep -oP '"5[- ]?[Yy]ear[^"]*"[^}]*"rate":\s*"?(\d+\.\d+)' | grep -oP '\d+\.\d+' | head -1 || echo "")
              fi
              # Pattern 3: Broader search for any rate-like numbers between 2-8%
              if [ -z "$RATE_5YR" ]; then
                RATE_5YR=$(echo "$PAGE" | grep -oP '5[- ]?[Yy]ear[^<]{0,100}\b([3-7]\.\d{2})\b' | grep -oP '[3-7]\.\d{2}' | head -1 || echo "")
              fi

              RATE_5VAR=$(echo "$PAGE" | grep -oP '[Vv]ariable[^<]{0,100}\b([2-8]\.\d{2})\b' | grep -oP '[2-8]\.\d{2}' | head -1 || echo "")
              RATE_3YR=$(echo "$PAGE" | grep -oP '3[- ]?[Yy]ear[^<]{0,100}\b([3-7]\.\d{2})\b' | grep -oP '[3-7]\.\d{2}' | head -1 || echo "")
              RATE_1YR=$(echo "$PAGE" | grep -oP '1[- ]?[Yy]ear[^<]{0,100}\b([3-8]\.\d{2})\b' | grep -oP '[3-8]\.\d{2}' | head -1 || echo "")
              RATE_2YR=$(echo "$PAGE" | grep -oP '2[- ]?[Yy]ear[^<]{0,100}\b([3-7]\.\d{2})\b' | grep -oP '[3-7]\.\d{2}' | head -1 || echo "")
              RATE_4YR=$(echo "$PAGE" | grep -oP '4[- ]?[Yy]ear[^<]{0,100}\b([3-7]\.\d{2})\b' | grep -oP '[3-7]\.\d{2}' | head -1 || echo "")

              # Count how many rates we actually scraped
              SCRAPED=0
              [ -n "$RATE_5YR" ] && SCRAPED=$((SCRAPED+1))
              [ -n "$RATE_5VAR" ] && SCRAPED=$((SCRAPED+1))
              [ -n "$RATE_3YR" ] && SCRAPED=$((SCRAPED+1))
              [ -n "$RATE_1YR" ] && SCRAPED=$((SCRAPED+1))

              echo "Scraped $SCRAPED rates from WOWA.ca"
              echo "  5yr fixed: ${RATE_5YR:-MISS} | 5yr var: ${RATE_5VAR:-MISS} | 3yr: ${RATE_3YR:-MISS} | 1yr: ${RATE_1YR:-MISS}"

              if [ "$SCRAPED" -lt 2 ]; then
                echo "::warning::WOWA scraper got fewer than 2 rates. Page structure may have changed. Using fallback rates."
                SCRAPE_FAILED=true
              fi
            fi

            # Use scraped values or fall back to current defaults
            # IMPORTANT: defaults should be updated manually when scraper fails
            echo "RATE_1YR=${RATE_1YR:-4.74}" >> $GITHUB_ENV
            echo "RATE_2YR=${RATE_2YR:-4.29}" >> $GITHUB_ENV
            echo "RATE_3YR=${RATE_3YR:-3.49}" >> $GITHUB_ENV
            echo "RATE_4YR=${RATE_4YR:-3.89}" >> $GITHUB_ENV
            echo "RATE_5YR_FIXED=${RATE_5YR:-3.69}" >> $GITHUB_ENV
            echo "RATE_5YR_VAR=${RATE_5VAR:-3.40}" >> $GITHUB_ENV
            echo "RATE_10YR=4.99" >> $GITHUB_ENV
            echo "RATE_SOURCE=WOWA.ca Best Uninsured Rates" >> $GITHUB_ENV
            echo "SCRAPE_FAILED=$SCRAPE_FAILED" >> $GITHUB_ENV
          fi

      - name: Update Supabase market_rates
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SUPABASE_URL="https://dotglplhsdsmrbacmtrx.supabase.co"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          update_rate() {
            local term_key="$1"
            local rate="$2"
            curl -sf -o /dev/null \
              "$SUPABASE_URL/rest/v1/market_rates?term_key=eq.$term_key&rate_type=eq.uninsured" \
              -X PATCH \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d "{\"rate\": $rate, \"source\": \"$RATE_SOURCE\", \"updated_at\": \"$DATE\"}"
            echo "Updated $term_key -> $rate%"
          }

          update_rate "1yr_fixed" "$RATE_1YR"
          update_rate "2yr_fixed" "$RATE_2YR"
          update_rate "3yr_fixed" "$RATE_3YR"
          update_rate "4yr_fixed" "$RATE_4YR"
          update_rate "5yr_fixed" "$RATE_5YR_FIXED"
          update_rate "5yr_variable" "$RATE_5YR_VAR"
          update_rate "10yr_fixed" "$RATE_10YR"

      - name: Update central rate hub (main Supabase)
        env:
          CENTRAL_SUPABASE_SERVICE_KEY: ${{ secrets.CENTRAL_SUPABASE_SERVICE_KEY }}
        run: |
          CENTRAL_URL="https://jkeujqzlclrxhwamplby.supabase.co"
          curl -sf \
            "$CENTRAL_URL/rest/v1/market_rates?id=eq.1" \
            -X PATCH \
            -H "apikey: $CENTRAL_SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $CENTRAL_SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"fixed_1yr\": $RATE_1YR,
              \"fixed_2yr\": $RATE_2YR,
              \"fixed_3yr\": $RATE_3YR,
              \"fixed_4yr\": $RATE_4YR,
              \"fixed_5yr\": $RATE_5YR_FIXED,
              \"fixed_10yr\": $RATE_10YR,
              \"vrm_effective\": $RATE_5YR_VAR,
              \"source\": \"$RATE_SOURCE\",
              \"updated_by\": \"github_actions\",
              \"quiz_supabase_synced_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }"
          echo "Central rate hub updated"

      - name: Update fallback rates in codebase
        run: |
          # calculations.ts
          sed -i "s/fiveYearFixed: [0-9.]*,/fiveYearFixed: $RATE_5YR_FIXED,/" src/lib/calculations.ts
          sed -i "s/fiveYearVariable: [0-9.]*,/fiveYearVariable: $RATE_5YR_VAR,/" src/lib/calculations.ts
          sed -i "s/threeYearFixed: [0-9.]*,/threeYearFixed: $RATE_3YR,/" src/lib/calculations.ts
          sed -i "s/oneYearFixed: [0-9.]*,/oneYearFixed: $RATE_1YR,/" src/lib/calculations.ts
          sed -i "s/twoYearFixed: [0-9.]*,/twoYearFixed: $RATE_2YR,/" src/lib/calculations.ts
          sed -i "s/fourYearFixed: [0-9.]*,/fourYearFixed: $RATE_4YR,/" src/lib/calculations.ts

          # supabase.ts
          sed -i "s/fiveYearFixed: data.fiveYearFixed ?? [0-9.]*,/fiveYearFixed: data.fiveYearFixed ?? $RATE_5YR_FIXED,/" src/lib/supabase.ts
          sed -i "s/fiveYearVariable: data.fiveYearVariable ?? [0-9.]*,/fiveYearVariable: data.fiveYearVariable ?? $RATE_5YR_VAR,/" src/lib/supabase.ts
          sed -i "s/threeYearFixed: data.threeYearFixed ?? [0-9.]*,/threeYearFixed: data.threeYearFixed ?? $RATE_3YR,/" src/lib/supabase.ts
          sed -i "s/oneYearFixed: data.oneYearFixed ?? [0-9.]*,/oneYearFixed: data.oneYearFixed ?? $RATE_1YR,/" src/lib/supabase.ts
          sed -i "s/twoYearFixed: data.twoYearFixed ?? [0-9.]*,/twoYearFixed: data.twoYearFixed ?? $RATE_2YR,/" src/lib/supabase.ts
          sed -i "s/fourYearFixed: data.fourYearFixed ?? [0-9.]*,/fourYearFixed: data.fourYearFixed ?? $RATE_4YR,/" src/lib/supabase.ts

      - name: Alert on scrape failure
        if: env.SCRAPE_FAILED == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -sf -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"FlowIQ <rates@getflowmortgage.ca>\",
              \"to\": \"alex@getflowmortgage.ca\",
              \"subject\": \"ALERT: Rate scraper failed - using stale defaults\",
              \"text\": \"The WOWA.ca rate scraper failed to extract fresh rates. The system is using fallback rates which may be outdated.\n\nFallback rates used:\n1yr: $RATE_1YR% | 3yr: $RATE_3YR% | 5yr: $RATE_5YR_FIXED% | Var: $RATE_5YR_VAR%\n\nAction needed: Manually update rates via GitHub Actions or check WOWA.ca page structure.\n\nRun: gh workflow run 'Weekly Rate Update' -f rate_5yr_fixed=X.XX -f rate_5yr_var=X.XX\"
            }" || echo "Alert email failed to send"

      - name: Commit and push if changed
        run: |
          git config user.name "flow-rate-bot"
          git config user.email "alex@getflowmortgage.ca"
          git add -A
          if git diff --cached --quiet; then
            echo "No rate changes detected"
          else
            git commit -m "chore: weekly rate update $(date +%Y-%m-%d)

            1yr: $RATE_1YR% | 2yr: $RATE_2YR% | 3yr: $RATE_3YR%
            4yr: $RATE_4YR% | 5yr fixed: $RATE_5YR_FIXED% | 5yr var: $RATE_5YR_VAR%
            Source: $RATE_SOURCE
            Scrape status: $([ \"$SCRAPE_FAILED\" = \"true\" ] && echo 'FALLBACK' || echo 'OK')"
            git push
          fi
