name: Weekly Rate Briefing

on:
  schedule:
    # Every Monday at 9:00 AM ET (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send only to this address (preview). Leave blank to send to the full team list.'
        required: false
        default: ''

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install jq and bc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq bc

      - name: Send rate intelligence briefing
        env:
          # SUPABASE_SERVICE_ROLE_KEY removed 2026-08-17: it belonged to the dead
          # Lovable project dotglplhsdsmrbacmtrx, whose frozen April table mailed
          # the team a 3.10% 5yr for four months. Rates now come from the public
          # mln-intelligence endpoint and need no key.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_EMAIL: ${{ inputs.test_email }}
          TZ: America/Toronto
        run: bash scripts/send-rate-briefing.sh
